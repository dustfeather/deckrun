name: PR checks

on:
  pull_request:
    # `closed` is here so a merge fires a same-concurrency-group run that
    # cancels the in-flight one. The new run itself does no work — the job
    # skips via the if: gate below.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]

permissions: { contents: read }

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event.action != 'closed'
    permissions: { contents: read }
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v6
    with:
      node-version: "24"
      # No `lint` script in package.json yet, so the lint gate would self-skip
      # silently. Turned off explicitly so a skipped gate is never mistaken for
      # a passing one; flip back to true in the same commit that adds ESLint.
      run-lint: false
      audit-level: low
      # GitHub-hosted, deliberately. The reusable workflow defaults to the
      # self-hosted ARC pool 'arc-df-shared-workflows', which does not serve
      # this repository: jobs sat queued indefinitely with no runner able to
      # claim them, which reads as "still running" rather than as a failure.
      # Revert to the shared pool once the scale set covers dustfeather/deckrun
      # — confirm with a non-empty runners array from
      # 'gh api repos/dustfeather/deckrun/actions/runners'.
      runner: ubuntu-latest
      # setup-node's cache is worth it here: a GitHub-hosted runner has no
      # persistent npm store, which is why the reusable workflow defaults this
      # off for its self-hosted callers.
      package-manager-cache: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
