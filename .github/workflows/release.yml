name: Release

on:
  push:
    tags: ["v*"]

permissions: { contents: read }

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same gates as a PR. A tag that cannot build or pass tests must not publish.
  tests:
    permissions: { contents: read }
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v6
    with:
      node-version: "22"
      run-lint: false
      audit-level: low
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    needs: tests
    runs-on: arc-df-shared-workflows
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for a short-lived
      # publish credential. No long-lived publish secret is stored on this repo,
      # by design — npm is removing direct publish from 2FA-bypass granular
      # access tokens (announced 2026-07-08, expected around January 2027), and
      # a credential that cannot be stolen from CI is the point rather than a
      # deadline to beat.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Pin npm to a version that speaks trusted publishing
        # OIDC publishing needs npm >= 11.5.1; the npm bundled with a Node 22
        # image is older than that. v12 also matches the install-time defaults
        # this repo's allowScripts entry is written against.
        run: npm install -g npm@^12

      - name: Refuse a tag that disagrees with package.json
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg." >&2
            exit 1
          fi
          echo "Publishing version $pkg."

      - run: npm ci

      - run: npm run build

      - name: Publish to npm
        # No registry auth env var here: npm mints its own credential from the
        # OIDC token above, and attaches provenance automatically when it does.
        run: npm publish --access public
