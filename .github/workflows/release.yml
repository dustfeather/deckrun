name: Release

on:
  push:
    tags: ["v*"]

permissions: { contents: read }

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same gates as a PR. A tag that cannot build or pass tests must not publish.
  tests:
    permissions: { contents: read }
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v8
    with:
      node-version: "26"
      run-lint: false
      audit-level: low
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    needs: tests
    # GitHub-hosted, and it has to be: npm attaches a provenance attestation
    # automatically under trusted publishing, and its registry accepts one only
    # from a github-hosted runner. Publishing from a self-hosted pool failed
    # with
    #   422 Unprocessable Entity - Error verifying sigstore provenance bundle:
    #   Unsupported GitHub Actions runner environment: "self-hosted".
    # Every job in this repo runs hosted now, so the constraint costs nothing —
    # it is recorded because --provenance=false is the only other way out, and
    # that throws the attestation away.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for a short-lived
      # publish credential. No long-lived publish secret is stored on this repo,
      # by design — npm is removing direct publish from 2FA-bypass granular
      # access tokens (announced 2026-07-08, expected around January 2027), and
      # a credential that cannot be stolen from CI is the point rather than a
      # deadline to beat.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org

      - name: Pin npm to a version that speaks trusted publishing
        # OIDC publishing needs npm >= 11.5.1; the npm bundled with a Node 22
        # image is older than that. v12 also matches the install-time defaults
        # this repo's allowScripts entry is written against.
        run: npm install -g npm@^12

      - name: Refuse a tag that disagrees with package.json
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg." >&2
            exit 1
          fi
          echo "Publishing version $pkg."

      - run: npm ci

      - run: npm run build

      - name: Pack the tarball that will be published
        # Build once, publish that exact artifact. `npm publish <tarball>` skips
        # the package.json normalisation npm applies to a directory spec
        # (lib/commands/publish.js: pkgJson.fix runs only for spec.type ===
        # 'directory'), so whatever this step writes is literally what lands on
        # the registry — no second build, no silent rewrite between test and
        # publish.
        id: pack
        run: |
          set -eu
          tarball=$(npm pack --silent)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball"
          tar -xzOf "$tarball" package/package.json | node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync(0, "utf8"));
            for (const [name, target] of Object.entries(pkg.bin ?? {})) {
              if (target.startsWith("./")) {
                console.error(`bin[${name}] is "${target}"; a tarball publish will not normalise it.`);
                process.exit(1);
              }
            }
            console.log(`bin ok: ${JSON.stringify(pkg.bin)}`);
          '

      - name: Keep the published tarball with the run
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the .tgz as-is instead of zipping it, so the
          # run's artifact is byte-for-byte what went to the registry and can be
          # installed straight from a download. It names the artifact after the
          # file, which is why no 'name' is given.
          archive: false
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 90

      - name: Smoke-test the tarball before it reaches the registry
        # Installs the artifact itself, not the working tree, so a missing file
        # in `files[]` or a broken bin link fails here rather than for a user.
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -eu
          work=$(mktemp -d)
          cp "$TARBALL" "$work/"
          cd "$work"
          npm init -y >/dev/null
          npm install "./$TARBALL"
          ./node_modules/.bin/deckrun --version

      - name: Publish to npm
        # No registry auth env var here: npm mints its own credential from the
        # OIDC token above, and attaches provenance automatically when it does.
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish --access public "$TARBALL"
